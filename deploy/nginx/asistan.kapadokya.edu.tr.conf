# HTTP vhost — Certbot bu dosyayı otomatik olarak HTTPS'e genişletebilir.
server {
    listen 80;
    listen [::]:80;
    server_name asistan.kapadokya.edu.tr;

    # İsteğe bağlı: ACME doğrulama için (certbot kullanıyorsanız otomatik ekler)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # SSE için özel lokasyon — buffering kapalı
    location /chat {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:5000;
    }

    # Diğer tüm yollar — uygulamaya yönlendirilir
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:5000;
    }
}

