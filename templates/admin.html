<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Manager</title>
  <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="/static/vendor/dataTables.bootstrap5.min.css" rel="stylesheet">
  <style>
    body { background: #f7f7fb; }
    .invalid-feedback { display: none; }
    .was-validated textarea:invalid ~ .invalid-feedback,
    .was-validated input:invalid ~ .invalid-feedback { display: block; }
    .position-relative small { position: absolute; bottom: 0.25rem; right: 0.5rem; }
    #authControl button { min-width: 100px; }
    .truncate { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
    .feedback-pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .pill-like { background: #e6f4ea; color: #137333; border: 1px solid #c6e9cc; }
    .pill-dislike { background: #fde8e8; color: #b71c1c; border: 1px solid #f9caca; }
  </style>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:,">
</head>
<body class="bg-light">
<div class="container py-4" id="admin-root" data-default-file="{{ PY_DEFAULT_F }}">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="mb-0">Admin Manager</h1>
    <div id="authControl">
      <button class="btn btn-success" id="loginBtn">Giriş Yap</button>
      <button class="btn btn-danger" id="logoutBtn" style="display:none;">Çıkış Yap</button>
    </div>
  </div>

  <ul class="nav nav-tabs" id="adminTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="qa-tab" data-bs-toggle="tab" data-bs-target="#qa-pane" type="button" role="tab" aria-controls="qa-pane" aria-selected="true">Soru‑Cevap</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="logs-tab" data-bs-toggle="tab" data-bs-target="#logs-pane" type="button" role="tab" aria-controls="logs-pane" aria-selected="false">Chat Logları</button>
    </li>
  </ul>
  <div class="tab-content border border-top-0 rounded-bottom p-3 bg-white shadow-sm" id="adminTabsContent">
    <div class="tab-pane fade show active" id="qa-pane" role="tabpanel" aria-labelledby="qa-tab" tabindex="0">
      <div class="mb-3">
        <select id="fileSelect" class="form-select w-auto d-inline-block me-2"></select>
        <button class="btn btn-primary" id="addBtn" disabled>Yeni Ekle</button>
      </div>
      <table id="qaTable" class="table table-striped table-bordered w-100">
        <thead class="table-dark"><tr>
          <th style="width:50px">#</th>
          <th>Sorular</th>
          <th style="min-width:200px">Cevap</th>
          <th style="width:120px">İşlemler</th>
        </tr></thead><tbody></tbody>
      </table>
    </div>

    <div class="tab-pane fade" id="logs-pane" role="tabpanel" aria-labelledby="logs-tab" tabindex="0">
      <div class="row g-2 align-items-end mb-3">
        <div class="col-auto">
          <label for="sessionSelect" class="form-label mb-1">Oturum</label>
          <select id="sessionSelect" class="form-select"></select>
        </div>
        <div class="col-auto">
          <label for="feedbackFilter" class="form-label mb-1">Feedback</label>
          <select id="feedbackFilter" class="form-select">
            <option value="any">Hepsi</option>
            <option value="like">Sadece Like</option>
            <option value="dislike">Sadece Dislike</option>
            <option value="unrated">Geri Bildirim Yok</option>
          </select>
        </div>
        <div class="col-auto">
          <label class="form-label mb-1">Tarih</label>
          <div class="d-flex gap-2">
            <input type="date" id="fromDate" class="form-control" placeholder="Başlangıç">
            <input type="date" id="toDate" class="form-control" placeholder="Bitiş">
          </div>
        </div>
        <div class="col-auto">
          <label class="form-label mb-1">Hızlı</label>
          <div class="btn-group d-flex">
            <button class="btn btn-outline-secondary" id="quickToday">Bugün</button>
            <button class="btn btn-outline-secondary" id="quick7d">Son 7 Gün</button>
            <button class="btn btn-outline-secondary" id="quickAll">Tümü</button>
          </div>
        </div>
        <div class="col-auto flex-grow-1">
          <label class="form-label mb-1" for="searchText">Ara</label>
          <input type="text" id="searchText" class="form-control" placeholder="Mesaj/yanıt içinde ara…">
        </div>
        <div class="col-auto">
          <button class="btn btn-primary" id="loadLogsBtn">Uygula</button>
        </div>
        <div class="col-auto ms-auto">
          <div class="btn-group" role="group">
            <button class="btn btn-success" id="quickLikes">Like'lar</button>
            <button class="btn btn-danger" id="quickDislikes">Dislike'lar</button>
          </div>
        </div>
      </div>

      <!-- Özet kartlar -->
      <div id="statsCards" class="row g-3 mb-3">
        <div class="col-sm-4">
          <div class="card border-success"><div class="card-body"><h6 class="card-title">Like</h6><div id="statLike" class="fs-4">0</div></div></div>
        </div>
        <div class="col-sm-4">
          <div class="card border-danger"><div class="card-body"><h6 class="card-title">Dislike</h6><div id="statDislike" class="fs-4">0</div></div></div>
        </div>
        <div class="col-sm-4">
          <div class="card border-secondary"><div class="card-body"><h6 class="card-title">Geri Bildirim Yok</h6><div id="statUnrated" class="fs-4">0</div></div></div>
        </div>
      </div>

      <!-- Kullanıcılar tablosu -->
      <div class="mb-3">
        <table id="usersTable" class="table table-sm table-hover w-100">
          <thead class="table-light"><tr>
            <th>Kullanıcı</th><th>Toplam</th><th>Like</th><th>Dislike</th><th>Boş</th><th>Son Aktivite</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <table id="logsTable" class="table table-striped table-bordered w-100">
        <thead class="table-dark"><tr>
          <th style="width:60px">#</th>
          <th style="width:160px">Zaman</th>
          <th style="width:100px">Feedback</th>
          <th>Kullanıcı Mesajı</th>
          <th>Asistan Yanıtı</th>
        </tr></thead><tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Modals -->
  <div class="modal fade" id="qaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="qaForm" class="needs-validation" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="qaModalLabel">Yeni Kayıt</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Sorular (her satıra bir):</label>
              <textarea id="questionsInput" class="form-control" rows="5" required placeholder="Her satıra bir soru yazın…" autofocus></textarea>
              <div class="invalid-feedback">Bu alan boş olamaz.</div>
            </div>
            <div class="mb-3 position-relative">
              <label class="form-label">Cevap:</label>
              <textarea id="answerInput" class="form-control" rows="10" required maxlength="600" placeholder="En fazla 600 karakter…"></textarea>
              <div class="invalid-feedback">Bu alan boş olamaz.</div>
              <small id="answerCount" class="form-text text-muted">0/600</small>
            </div>
            <input type="hidden" id="editIdx">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
            <button type="submit" class="btn btn-primary">Kaydet</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <form id="loginForm">
          <div class="modal-header">
            <h5 class="modal-title">Giriş Yap</h5>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="loginPasswordInput" class="form-label">Şifre:</label>
              <input type="password" id="loginPasswordInput" class="form-control" required autofocus>
              <div class="invalid-feedback">Şifre gereklidir.</div>
            </div>
            <div id="loginError" class="text-danger small" style="display:none;"></div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/vendor/jquery-3.7.1.min.js?v=2"></script>
  <script src="/static/vendor/bootstrap.bundle.min.js?v=2"></script>
  <script src="/static/vendor/jquery.dataTables.min.js?v=2"></script>
  <script src="/static/vendor/dataTables.bootstrap5.min.js?v=2"></script>
  <script src="/static/js/admin.js?v=2"></script>
</div>
</body>
</html>
